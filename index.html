<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Answer Book (Gesture)</title>

  <!-- p5 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

  <!-- MediaPipe Hands + utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>

  <style>
    :root{
      --bg:#ffffff;
      --fg:#111111;
      --muted:#8a8a8a;
      --line:#e7e7e7;
    }
    html,body{
      margin:0; padding:0;
      background:var(--bg);
      color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
    }

    #ui{
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, calc(100vw - 32px));
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    #question{
      flex: 1;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 16px;
      outline: none;
      font-size: 14px;
      background: #fff;
    }

    #confirm{
      height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    #confirm:disabled{
      background:#bbb;
      cursor: not-allowed;
    }

    #hint{
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, calc(100vw - 32px));
      display:flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <input id="question" placeholder="Type a question…" />
    <button id="confirm">Confirm</button>
  </div>

  <div id="hint">
    <div>Confirm → start</div>
    <div>Swipe → shuffle · Fist → select</div>
  </div>

  <script src="hands.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
